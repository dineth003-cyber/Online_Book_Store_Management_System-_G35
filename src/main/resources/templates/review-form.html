<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Review</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 40px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: #1a73e8; }
        .btn-submit { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background: #155cb4; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ Write a Review</h2>

    <form th:action="@{/add-review}" method="post">

        <div class="form-group">
            <label>Book ID:</label>
            <input type="text" name="bookId" placeholder="e.g. B001" required>
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input type="text" name="user" placeholder="Your Name" required>
        </div>

        <div class="form-group">
            <label>Rating (1-5):</label>
            <input type="number" name="rating" min="1" max="5" placeholder="Enter rating" required>
        </div>

        <div class="form-group">
            <label>Comment:</label>
            <textarea name="comment" rows="4" placeholder="Write your thoughts..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Review</button>
    </form>
</div>

</body>
</html>
