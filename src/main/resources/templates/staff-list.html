<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff List</title>
</head>
<body>

<h2>Staff List</h2>

<table border="1">

  <!-- Table Header -->
  <tr>
    <th>Staff Details</th>
    <th>Action</th>
  </tr>

  <!-- Loop through staff list -->
  <tr th:each="s : ${staffList}">

    <!-- Display staff data -->
    <td th:text="${s}"></td>

    <!-- Delete button -->
    <td>
      <!-- Id eka split karala ganna thiba syntax error eka fix kala -->
      <a th:href="@{/delete-staff(id=${#strings.arraySplit(s, ',')[0]})}"
         onclick="return confirm('Are you sure you want to delete this staff member?');">
        Delete
      </a>
    </td>
  </tr>
  <tr th:each="st : ${staffs}">
    <td th:text="${st.id}"></td>
    <td th:text="${st.name}"></td>
    <td th:text="${st.role}"></td>
    <td th:text="${st.salary}"></td>
    <td>
      <a th:href="@{'/edit-staff/' + ${st.id}}" style="color: #1a73e8; font-weight: bold; text-decoration: none; margin-right: 10px;">Edit</a>
      <a th:href="@{'/delete-staff/' + ${st.id}}" style="color: #d93025; font-weight: bold; text-decoration: none;" onclick="return confirm('Are you sure you want to delete this staff member?')">Delete</a>
    </td>
  </tr>

</table>

<br><br>

<!-- Back button -->
<a href="/admin">Back to Dashboard</a>

</body>
</html>
