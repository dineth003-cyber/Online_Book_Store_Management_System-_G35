<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add New Staff</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 40px; color: #333; }
    .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #1a73e8; }
    .btn-submit { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-submit:hover { background: #218838; }
  </style>
</head>
<body>

<div class="container">
  <h2>➕ Add New Staff</h2>

  <form th:action="@{/add-staff}" method="post">

    <div class="form-group">
      <label>Staff ID:</label>
      <input type="text" name="id" placeholder="e.g. ID20030922" required>
    </div>

    <div class="form-group">
      <label>Name:</label>
      <input type="text" name="name" placeholder="Staff Member's Name" required>
    </div>

    <div class="form-group">
      <label>Role:</label>
      <input type="text" name="role" placeholder="e.g. Director / Manager" required>
    </div>

    <div class="form-group">
      <label>Salary:</label>
      <input type="number" name="salary" placeholder="Enter Salary" required>
    </div>

    <button type="submit" class="btn-submit">Save Staff</button>
  </form>
</div>

</body>
</html>
