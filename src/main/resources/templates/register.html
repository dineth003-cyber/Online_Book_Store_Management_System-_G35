<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>User Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9;}
    .form-container { background: white; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0px 0px 10px 0px #0000001a; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #218838; }
    .success-msg { color: green; font-weight: bold; margin-bottom: 15px;}
  </style>
</head>
<body>

<h2>Register New User</h2>

<div class="form-container">
  <p class="success-msg" th:if="${message}" th:text="${message}"></p>

  <form action="/register" method="post" th:object="${user}">
    <label>User ID:</label>
    <input type="text" th:field="*{id}" required />

    <label>Name:</label>
    <input type="text" th:field="*{name}" required />

    <label>Email:</label>
    <input type="email" th:field="*{email}" required />

    <label>Password:</label>
    <input type="password" th:field="*{password}" required />

    <label>Phone Number:</label>
    <input type="text" th:field="*{phoneNumber}" required />

    <label>Address:</label>
    <input type="text" th:field="*{address}" required />

    <button type="submit">Register</button>
  </form>
                         <form action="/register" method="post" th:object="${user}">
                              </form> 
</div>

</body>
</html>
