<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 40px; color: #333; }
    .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
    h2 { color: #1a73e8; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; margin: 20px 0; }
    li { margin-bottom: 15px; }
    .btn-link { display: block; padding: 12px; background: #1a73e8; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: background 0.3s; }
    .btn-link:hover { background: #155cb4; }
  </style>
</head>
<body>

<div class="container">
  <h2>👨‍💼 Admin Dashboard</h2>

  <ul>
    <li>
      <a th:href="@{/staff-form}" class="btn-link">➕ Add Staff</a>
    </li>
    <li>
      <a th:href="@{/staff-list}" class="btn-link">📋 View Staff List</a>
    </li>
  </ul>
</div>

</body>
</html>
