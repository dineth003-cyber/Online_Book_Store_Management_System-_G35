<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reviews</title>
</head>
<body>

<h2>Customer Reviews</h2>

<table border="1">
  <tr>
    <th>Review</th>
    <th>Action</th>
  </tr>

  <!-- Loop through reviews list -->
  <tr th:each="r : ${reviews}">
    <td th:text="${r}"></td>
    <td>
      <!-- Delete action with dynamic username parameter -->
      <a th:href="@{/delete-review(user=${#strings.arraySplit(r, ',')[1]})}"
         onclick="return confirm('Are you sure you want to delete this review?');">
        Delete
      </a>
    </td>
  </tr>
</table>

<br><br>

<!-- Add Review and Form redirection link -->
<a th:href="@{/review-form}">Add New Review</a>

</body>
</html>
